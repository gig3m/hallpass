name: Feature request
description: Something hallpass should do, or stop doing, when it grants USB access
title: ""
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to open?
      description: The device, the program that needs it (VIA, Vial, a WebUSB flasher, dfu-util, QMK Toolbox, something else), and what you have to do by hand today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should hallpass do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: What should the pass still refuse to match?
      description: A pass is a root-owned udev rule. Call out if the idea would widen a match to a whole vendor, a hub's downstream devices, or every user on the machine.
